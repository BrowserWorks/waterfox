<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://browser/content/aboutpasswords/passwordManager.css"
type="text/css"?>

<window
  id="SignonViewerDialog"
  windowtype="Toolkit:passwordManager"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="_Startup()"
  onunload="_Shutdown()"
  data-l10n-id="waterfox-passwords-window"
  csp="default-src chrome:; object-src 'none'"
  style="min-width: 45em"
  persist="width height screenX screenY"
>
  <html:link rel="localization" href="browser/waterfox/passwords.ftl" />
  <script src="chrome://browser/content/utilityOverlay.js" />
  <script src="chrome://browser/content/aboutpasswords/passwordManager.js" />

  <keyset>
    <key keycode="VK_ESCAPE" oncommand="_escapeKeyHandler()" />
    <key key="w" modifiers="accel" oncommand="_escapeKeyHandler()" />
    <key key="f" modifiers="accel" oncommand="FocusFilterBox()" />
    <key key="k" modifiers="accel" oncommand="FocusFilterBox()" />
  </keyset>

  <popupset id="signonsTreeContextSet">
    <menupopup
      id="signonsTreeContextMenu"
      onpopupshowing="_UpdateContextMenu()"
    >
      <menuitem
        id="context-copysiteurl"
        data-l10n-id="waterfox-passwords-copy-url"
        oncommand="_CopySiteUrl()"
      />
      <menuitem
        id="context-launchsiteurl"
        data-l10n-id="waterfox-passwords-visit-url"
        oncommand="_LaunchSiteUrl()"
      />
      <menuseparator />
      <menuitem
        id="context-copyusername"
        data-l10n-id="waterfox-passwords-copy-username"
        oncommand="_CopyUsername()"
      />
      <menuitem
        id="context-editusername"
        data-l10n-id="waterfox-passwords-edit-username"
        oncommand="_EditCellInSelectedRow('username')"
      />
      <menuseparator />
      <menuitem
        id="context-copypassword"
        data-l10n-id="waterfox-passwords-copy-password"
        oncommand="_CopyPassword()"
      />
      <menuitem
        id="context-editpassword"
        data-l10n-id="waterfox-passwords-edit-password"
        oncommand="_EditCellInSelectedRow('password')"
      />
    </menupopup>
  </popupset>

  <!-- saved signons -->
  <vbox id="savedsignons" class="contentPane" flex="1">
    <!-- filter -->
    <hbox align="center">
      <html:input
        id="filter"
        data-l10n-id="waterfox-passwords-search"
        data-l10n-attrs="accesskey"
        type="search"
        aria-controls="signonsTree"
      />
    </hbox>

    <label control="signonsTree" id="signonsIntro" />
    <separator class="thin" />
    <tree
      id="signonsTree"
      flex="1"
      width="750"
      style="height: 20em"
      onkeypress="_HandleSignonKeyPress(event)"
      onselect="_SignonSelected()"
      editable="true"
      context="signonsTreeContextMenu"
    >
      <treecols>
        <treecol
          id="siteCol"
          data-l10n-id="waterfox-passwords-site"
          style="-moz-box-flex: 40"
          data-field-name="origin"
          persist="width"
          ignoreincolumnpicker="true"
          sortDirection="ascending"
        />
        <splitter class="tree-splitter" />
        <treecol
          id="userCol"
          data-l10n-id="waterfox-passwords-username"
          style="-moz-box-flex: 25"
          ignoreincolumnpicker="true"
          data-field-name="username"
          persist="width"
        />
        <splitter class="tree-splitter" />
        <treecol
          id="passwordCol"
          data-l10n-id="waterfox-passwords-password"
          style="-moz-box-flex: 15"
          ignoreincolumnpicker="true"
          data-field-name="password"
          persist="width"
          hidden="true"
        />
        <splitter class="tree-splitter" />
        <treecol
          id="timeCreatedCol"
          data-l10n-id="waterfox-passwords-first-used"
          style="-moz-box-flex: 10"
          data-field-name="timeCreated"
          persist="width"
        />
        <splitter class="tree-splitter" />
        <treecol
          id="timeLastUsedCol"
          data-l10n-id="waterfox-passwords-last-used"
          style="-moz-box-flex: 20"
          data-field-name="timeLastUsed"
          persist="width"
        />
        <splitter class="tree-splitter" />
        <treecol
          id="timePasswordChangedCol"
          data-l10n-id="waterfox-passwords-last-changed"
          style="-moz-box-flex: 10"
          data-field-name="timePasswordChanged"
          persist="width hidden"
        />
        <splitter class="tree-splitter" />
        <treecol
          id="timesUsedCol"
          data-l10n-id="waterfox-passwords-times-used"
          flex="1"
          data-field-name="timesUsed"
          persist="width"
        />
        <splitter class="tree-splitter" />
      </treecols>
      <treechildren />
    </tree>
    <separator class="thin" />
    <hbox id="SignonViewerButtons">
      <button
        id="removeSignon"
        data-l10n-id="waterfox-passwords-remove"
        disabled="true"
        oncommand="DeleteSignon()"
      />
      <button id="removeAllSignons" oncommand="_DeleteAllSignons()" />
      <spacer flex="1" />
      <button
        data-l10n-id="waterfox-passwords-import"
        oncommand="_OpenMigrator()"
      />
      <button id="togglePasswords" oncommand="_TogglePasswordVisible()" />
    </hbox>
  </vbox>
</window>
