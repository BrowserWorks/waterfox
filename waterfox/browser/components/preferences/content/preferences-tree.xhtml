<!-- Tree panel -->

<script>
    /* eslint-env mozilla/browser-window */
    /* globals register_module _gTreePane gotoPref */
    Services.scriptloader.loadSubScript("chrome://browser/content/overlays/tree.js", this);

    // Register the pane
    register_module("paneTree", _gTreePane);

    // This ensure that we actually render the Tree page when refreshing on
    // about:preferences#tree. It is needed because the regular gotoPref in
    // preferences.js cannot function properly as we do not register_module
    // until this file is loaded, which has not been done when preferences.js
    // is init'd.
    if (location.href.includes("#tree")) {
        setTimeout(() => {
            gotoPref("paneTree");
        }, 0);
    }
</script>
