<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://global/skin/in-content/info-pages.css"
type="text/css"?> <?xml-stylesheet
href="chrome://browser/content/aboutcfg/aboutcfg.css" type="text/css"?>

<window
  id="config"
  title="about:cfg"
  csp="default-src chrome:; object-src 'none'"
  data-l10n-id="waterfox-aboutcfg-window"
  aria-describedby="warningTitle warningText"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  windowtype="Preferences:ConfigManager"
  role="application"
  width="750"
  height="500"
>
  <html:link rel="localization" href="browser/waterfox/aboutcfg.ftl" />
  <html:link rel="icon" href="chrome://global/skin/icons/settings.svg" />

  <script src="chrome://browser/content/aboutcfg/aboutcfg.js" />
  <script src="chrome://global/content/editMenuOverlay.js" />
  <script src="chrome://global/content/globalOverlay.js" />

  <menupopup id="configContext">
    <menuitem
      id="toggleSelected"
      data-l10n-id="waterfox-aboutcfg-toggle"
      default="true"
    />
    <menuitem
      id="modifySelected"
      data-l10n-id="waterfox-aboutcfg-modify"
      default="true"
    />
    <menuseparator />
    <menuitem id="copyPref" data-l10n-id="waterfox-aboutcfg-copy" />
    <menuitem id="copyName" data-l10n-id="waterfox-aboutcfg-copy-name" />
    <menuitem id="copyValue" data-l10n-id="waterfox-aboutcfg-copy-value" />
    <menu data-l10n-id="waterfox-aboutcfg-new">
      <menupopup>
        <menuitem id="configString" data-l10n-id="waterfox-aboutcfg-string" />
        <menuitem id="configInt" data-l10n-id="waterfox-aboutcfg-integer" />
        <menuitem id="configBool" data-l10n-id="waterfox-aboutcfg-boolean" />
      </menupopup>
    </menu>
    <menuitem id="resetSelected" data-l10n-id="waterfox-aboutcfg-reset" />
  </menupopup>

  <keyset id="configTreeKeyset" disabled="true">
    <key id="keyVKReturn" keycode="VK_RETURN" />
    <key id="configFocuSearch" modifiers="accel" key="r" />
    <key id="configFocuSearch2" modifiers="accel" key="f" />
  </keyset>
  <deck id="configDeck" flex="1">
    <vbox id="warningScreen" flex="1" align="center" style="overflow: auto">
      <spacer flex="1" />
      <vbox id="warningBox" class="container">
        <hbox class="title" flex="1">
          <label
            id="warningTitle"
            data-l10n-id="waterfox-aboutcfg-warning-title"
            class="title-text"
            flex="1"
          ></label>
        </hbox>
        <vbox class="description" flex="1">
          <label
            id="warningText"
            data-l10n-id="waterfox-aboutcfg-warning-text"
          />
          <checkbox
            id="showWarningNextTime"
            data-l10n-id="waterfox-aboutcfg-warning-next-time"
            checked="true"
          />
          <hbox class="button-container">
            <button
              id="warningButton"
              data-l10n-id="waterfox-aboutcfg-warning-accept"
              class="primary"
            />
          </hbox>
        </vbox>
      </vbox>
      <spacer flex="2" />
    </vbox>
    <vbox flex="1">
      <hbox id="filterRow" align="center">
        <label data-l10n-id="waterfox-aboutcfg-search" control="textbox" />
        <html:input id="textbox" type="search" aria-controls="configTree" />
      </hbox>
      <tree
        id="configTree"
        flex="1"
        seltype="single"
        enableColumnDrag="true"
        context="configContext"
      >
        <treecols>
          <!--
          The below code may suggest that 'ordinal' is still a supported XUL
          attribute. It is not. This is a crutch so that we can continue
          persisting the CSS -moz-box-ordinal-group attribute, which is the
          appropriate replacement for the ordinal attribute but cannot yet
          be easily persisted. The code that synchronizes the attribute with
          the CSS lives in toolkit/content/widget/tree.js and is specific to
          tree elements.
        -->
          <treecol
            id="prefCol"
            data-l10n-id="waterfox-aboutcfg-pref-name"
            flex="7"
            ignoreincolumnpicker="true"
            persist="hidden width ordinal sortDirection"
          />
          <splitter class="tree-splitter" />
          <treecol
            id="lockCol"
            data-l10n-id="waterfox-aboutcfg-status"
            flex="1"
            persist="hidden width ordinal sortDirection"
          />
          <splitter class="tree-splitter" />
          <treecol
            id="typeCol"
            data-l10n-id="waterfox-aboutcfg-type"
            flex="1"
            persist="hidden width ordinal sortDirection"
          />
          <splitter class="tree-splitter" />
          <treecol
            id="valueCol"
            data-l10n-id="waterfox-aboutcfg-value"
            flex="10"
            persist="hidden width ordinal sortDirection"
          />
        </treecols>

        <treechildren id="configTreeBody" />
      </tree>
    </vbox>
  </deck>
</window>
