<?csp default-src chrome:; style-src chrome:; ?>

<window
  id="WaterfoxBlockerAllowlistDialog"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  data-l10n-id="waterfox-blocker-allowlist-window"
  data-l10n-attrs="title"
  persist="width height"
>
  <dialog
    id="allowlistDialog"
    buttons="accept,cancel"
    data-l10n-id="permission-dialog"
    data-l10n-attrs="buttonlabelaccept, buttonaccesskeyaccept"
  >
    <linkset>
      <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
      <html:link
        rel="stylesheet"
        href="chrome://browser/content/preferences/dialogs/sitePermissions.css"
      />
      <html:link
        rel="stylesheet"
        href="chrome://browser/skin/preferences/preferences.css"
      />
      <html:link
        rel="stylesheet"
        href="chrome://browser/content/blocker/waterfoxBlockerAllowlist.css"
      />

      <html:link rel="localization" href="branding/brand.ftl" />
      <html:link rel="localization" href="browser/waterfox.ftl" />

      <html:link
        rel="localization"
        href="browser/preferences/permissions.ftl"
      />
    </linkset>

    <script src="chrome://browser/content/preferences/dialogs/waterfoxBlockerAllowlist.js" />

    <keyset>
      <key
        id="key_close"
        data-l10n-id="permissions-close-key"
        modifiers="accel"
      />
    </keyset>

    <vbox class="contentPane">
      <description
        id="allowlistText"
        control="url"
        data-l10n-id="waterfox-blocker-allowlist-description"
      />
      <separator class="thin" />
      <label
        id="urlLabel"
        control="url"
        data-l10n-id="waterfox-blocker-allowlist-entry-field"
      />
      <hbox align="start">
        <html:input id="url" type="text" />
      </hbox>
      <hbox pack="end">
        <button
          id="btnAddSite"
          disabled="true"
          data-l10n-id="waterfox-blocker-allowlist-add"
        />
      </hbox>
      <separator class="thin" />
      <listheader>
        <treecol
          id="siteCol"
          data-l10n-id="permissions-doh-col"
          data-isCurrentSortCol="true"
        />
      </listheader>
      <richlistbox id="permissionsBox" selected="false" />
    </vbox>

    <hbox class="actionButtons">
      <button
        id="removeSite"
        disabled="true"
        data-l10n-id="permissions-doh-remove"
      />
      <button id="removeAllSites" data-l10n-id="permissions-doh-remove-all" />
    </hbox>
  </dialog>
</window>
