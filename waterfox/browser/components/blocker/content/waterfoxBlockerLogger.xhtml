<?csp default-src chrome:; style-src chrome:; ?>

<window
  id="WaterfoxBlockerLoggerWindow"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  data-l10n-id="waterfox-blocker-logger-window"
  data-l10n-attrs="title"
  persist="width height screenX screenY"
  title="Blocker Logger"
  width="1100"
  height="760"
  windowtype="waterfox:blocker-logger"
>
  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
    <html:link
      rel="stylesheet"
      href="chrome://browser/skin/preferences/preferences.css"
    />
    <html:link
      rel="stylesheet"
      href="chrome://browser/content/blocker/waterfoxBlockerLogger.css"
    />
    <html:link rel="localization" href="branding/brand.ftl" />
    <html:link rel="localization" href="browser/waterfox.ftl" />
  </linkset>

  <script src="chrome://browser/content/blocker/waterfoxBlockerLogger.js" />

  <vbox class="contentPane" flex="1">
    <description
      id="waterfoxBlockerLoggerDescription"
      data-l10n-id="waterfox-blocker-logger-description"
    >
      Review blocker activity from the current browsing session.
    </description>

    <vbox class="waterfox-blocker-section-card" flex="1">
      <hbox class="waterfox-blocker-logger-toolbar" align="center">
        <checkbox
          id="waterfoxBlockerLoggerCurrentTabOnly"
          data-l10n-id="waterfox-blocker-logger-current-tab-only"
          label="Current tab only"
        />
        <spacer flex="1" />
        <button
          id="waterfoxBlockerLoggerPause"
          data-l10n-id="waterfox-blocker-logger-pause"
          label="Pause"
        />
        <button
          id="waterfoxBlockerLoggerClear"
          data-l10n-id="waterfox-blocker-logger-clear"
          label="Clear"
        />
        <button
          id="waterfoxBlockerLoggerExport"
          data-l10n-id="waterfox-blocker-logger-export"
          label="Export…"
        />
      </hbox>

      <hbox align="center" class="waterfox-blocker-logger-summary-row">
        <label
          id="waterfoxBlockerSummary"
          class="text-deemphasized waterfox-blocker-logger-summary"
        />
        <spacer flex="1" />
        <label
          id="waterfoxBlockerLoggerState"
          class="waterfox-blocker-logger-state"
        />
      </hbox>

      <richlistbox
        id="waterfoxBlockerLoggerList"
        class="waterfox-blocker-logger-list"
        flex="1"
        selected="false"
      />
    </vbox>

    <vbox
      class="waterfox-blocker-section-card waterfox-blocker-logger-details-card"
    >
      <label
        class="waterfox-blocker-section-title"
        data-l10n-id="waterfox-blocker-logger-details-title"
        value="Entry details"
      />
      <description
        class="text-deemphasized waterfox-blocker-section-description"
        data-l10n-id="waterfox-blocker-logger-details-hint"
      >
        Select an entry to inspect it.
      </description>
      <vbox
        id="waterfoxBlockerLoggerDetailsRows"
        class="waterfox-blocker-logger-details-rows"
      />
    </vbox>
  </vbox>
</window>
