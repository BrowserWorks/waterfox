<?csp default-src chrome:; style-src chrome:; ?>

<window
  id="WaterfoxBlockerExceptionsDialog"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  data-l10n-id="waterfox-blocker-exceptions-window"
  data-l10n-attrs="title"
  persist="width height"
>
  <dialog
    id="exceptionDialog"
    buttons="accept,cancel"
    data-l10n-id="permission-dialog"
    data-l10n-attrs="buttonlabelaccept, buttonaccesskeyaccept"
  >
    <linkset>
      <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
      <html:link
        rel="stylesheet"
        href="chrome://browser/content/preferences/dialogs/sitePermissions.css"
      />
      <html:link
        rel="stylesheet"
        href="chrome://browser/skin/preferences/preferences.css"
      />
      <html:link
        rel="stylesheet"
        href="chrome://browser/content/blocker/waterfoxBlockerExceptions.css"
      />

      <html:link rel="localization" href="branding/brand.ftl" />
      <html:link rel="localization" href="browser/waterfox.ftl" />

      <html:link
        rel="localization"
        href="browser/preferences/permissions.ftl"
      />
    </linkset>

    <script src="chrome://browser/content/preferences/dialogs/waterfoxBlockerExceptions.js" />

    <keyset>
      <key
        id="key_close"
        data-l10n-id="permissions-close-key"
        modifiers="accel"
      />
    </keyset>

    <vbox class="contentPane">
      <description
        id="dohExceptionText"
        control="url"
        data-l10n-id="waterfox-blocker-exceptions-description"
      />
      <vbox class="waterfox-blocker-section-card">
        <label
          id="urlLabel"
          control="url"
          class="waterfox-blocker-section-title"
          data-l10n-id="waterfox-blocker-exceptions-entry-field"
        />
        <description
          class="text-deemphasized waterfox-blocker-section-description"
          data-l10n-id="waterfox-blocker-exceptions-entry-field-description"
        />
        <html:textarea
          id="url"
          class="waterfox-blocker-textarea waterfox-blocker-allowlist-textarea"
          data-l10n-id="waterfox-blocker-exceptions-placeholder"
          data-l10n-attrs="placeholder"
          rows="4"
        />
        <hbox class="waterfox-blocker-editor-toolbar" align="center">
          <spacer flex="1" />
          <button
            id="btnAddException"
            disabled="true"
            data-l10n-id="waterfox-blocker-exceptions-add"
          />
          <button
            id="importExceptions"
            data-l10n-id="waterfox-blocker-exceptions-import"
          />
          <button
            id="exportExceptions"
            data-l10n-id="waterfox-blocker-exceptions-export"
          />
        </hbox>
      </vbox>
      <separator class="thin" />
      <listheader>
        <treecol
          id="siteCol"
          data-l10n-id="permissions-doh-col"
          data-isCurrentSortCol="true"
        />
      </listheader>
      <richlistbox id="permissionsBox" selected="false" />
    </vbox>

    <hbox class="actionButtons">
      <button
        id="removeException"
        disabled="true"
        data-l10n-id="permissions-doh-remove"
      />
      <button
        id="removeAllExceptions"
        data-l10n-id="permissions-doh-remove-all"
      />
    </hbox>
  </dialog>
</window>
