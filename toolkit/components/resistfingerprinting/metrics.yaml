  css_system_colors:
    type: text
    description: >
      JSON array containing CSS system color keywords and their computed values as
      uppercase 8-char RRGGBBAA hex (without # prefix). System colors (like Canvas,
      ButtonFace, LinkText, etc.) are CSS keywords that resolve to theme/OS-specific
      colors and can be used for fingerprinting. This metric collects the computed
      backgroundColor for each system color keyword. Data format:
      [{"Canvas": "FFFFFFFF"}, {"ButtonFace": "E9E9EDFF"}, ...].
      Values here are content-resolved: they respect the page color-scheme
      (so dark-mode users will see Firefox's dark Canvas 1C1B22FF, etc.)
      and have content-side standins applied. Alpha is preserved where
      CSS resolution preserves it (e.g. macOS Highlight comes through
      with alpha 0x7F); for translucent system colors that CSS resolves
      against a backdrop (e.g. HighlightText on some platforms), the
      resolved opaque RGB carries a trailing FF and the source's alpha
      is no longer recoverable from this metric — see the `color_*`
      quantities for the raw nscolor values, which preserve alpha
      unconditionally. Notably on Windows the
      AccentColor entry returns the Firefox brand color 0060DF rather
      than the user's real Windows accent because
      widget.non-native-theme.use-theme-accent defaults to false on
      Windows (see widget/ThemeColors.h::sDefaultAccent and
      nsXPLookAndFeel.cpp::ShouldUseStandinsForNativeColorForNonNativeTheme).
      The standin is suppressed in High Contrast / forced-colors mode
      (`use_document_colors`=false), where the real accent passes through.
      The `color_*` quantity metrics report the underlying platform value
      (LookAndFeel with ColorScheme::Light forced and UseStandins::No),
      bypassing the standin and color-scheme paths entirely.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
      - tom@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1879151
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2010671
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2010671
    expires: never
    data_sensitivity:
      # Text metrics are _required_ to be web_activity or highly_sensitive, so even though this
      # is more like 'technical' (per the Data Review), I'm marking highly sensitive.
      - highly_sensitive

  css_system_fonts:
    type: text
    description: >
      JSON array containing CSS system font keywords and their computed font properties.
      System fonts (like caption, icon, menu, etc.) and common font families are tested
      to determine their rendered fontSize and fontFamily values, which can vary by OS
      and be used for fingerprinting. This metric collects computed fontSize + fontFamily
      for each font keyword/name tested.
      Data format: [{"caption": "11px system-ui"}, {"Arial": "16px Arial"}, ...].
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
