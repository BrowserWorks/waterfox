  color_accentcolor:
    type: quantity
    unit: RGB
    description: >
      The platform Accentcolor returned by LookAndFeel::GetColor with
      ColorScheme::Light forced and UseStandins::No (see
      PopulateCSSProperties in nsUserCharacteristics.cpp). On Windows this
      reports the user's real OS accent color; the AccentColor entry in
      `css_system_colors` instead reports the Firefox brand color 0060DF
      because the content path applies a standin gated on
      widget.non-native-theme.use-theme-accent (default false on Windows),
      see widget/ThemeColors.h::sDefaultAccent and
      nsXPLookAndFeel.cpp::ShouldUseStandinsForNativeColorForNonNativeTheme.
      In Windows High Contrast / forced-colors mode
      (`use_document_colors`=false) the standin is suppressed and content
      sees the real accent. The value is the raw nscolor uint32 with R in
      the low byte and includes the alpha channel; `css_system_colors`
      also emits 8-char RRGGBBAA.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
      - tom@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    expires: never
    data_sensitivity:
      - technical

  color_accentcolortext:
    type: quantity
    unit: RGB
    description: >
      The platform Accentcolortext returned by LookAndFeel::GetColor with
      ColorScheme::Light forced and UseStandins::No (see
      PopulateCSSProperties in nsUserCharacteristics.cpp). Same standin
      semantics as `color_accentcolor`: on Windows the content path
      (`css_system_colors`) substitutes the Firefox brand AccentColorText
      while this metric reports the real OS value. The value is the raw
      nscolor uint32 with R in the low byte and includes the alpha
      channel; `css_system_colors` also emits 8-char RRGGBBAA.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
