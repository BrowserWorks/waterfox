    expires: never
    data_sensitivity:
      - technical

  color_highlight:
    type: quantity
    unit: RGB
    description: >
      The platform Highlight (selection background) returned by
      LookAndFeel::GetColor with ColorScheme::Light forced and
      UseStandins::No (see PopulateCSSProperties in
      nsUserCharacteristics.cpp). This metric preserves the alpha
      channel: the OS-default highlight is translucent on several
      platforms (e.g. macOS alpha 0x7F, Android 0x4E); the parallel
      Highlight entry in `css_system_colors` resolves with the page
      color-scheme; alpha is preserved where CSS resolution preserves it
      (mac Highlight 0x7F survives). The value is the raw nscolor uint32
      with R in the low byte.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
      - tom@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    expires: never
    data_sensitivity:
      - technical

  color_highlighttext:
    type: quantity
    unit: RGB
    description: >
      The platform Highlighttext (selection foreground) returned by
      LookAndFeel::GetColor with ColorScheme::Light forced and
      UseStandins::No (see PopulateCSSProperties in
      nsUserCharacteristics.cpp). Includes alpha — on some platforms
      (e.g. Android) the OS value is a translucent/edge color with no
      direct equivalent in the content-resolved path; the parallel
      HighlightText entry in `css_system_colors` resolves with the page
      color-scheme against a backdrop (the source's alpha is folded into
      the opaque result, so `css_system_colors` reports the resolved
      opaque value with a trailing FF, not the original translucent
      source). The value is the raw nscolor uint32 with R in the low
      byte.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
      - tom@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    expires: never
    data_sensitivity:
      - technical

