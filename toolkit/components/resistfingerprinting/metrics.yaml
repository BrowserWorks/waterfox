    expires: never
    data_sensitivity:
      - technical

  color_canvas:
    type: quantity
    unit: RGB
    description: >
      The Canvas default background from
      PreferenceSheet::ContentPrefs::ColorsFor(ColorScheme::Light)
      .mDefaultBackground (see PopulateCSSProperties in
      nsUserCharacteristics.cpp). This value is forced-Light: for users
      browsing in dark mode it is still the Light default (typically
      FFFFFF) and is NOT the canvas the user actually sees rendered
      (Firefox's dark canvas is 1C1B22). To capture the canvas as it
      resolves in content with the page color-scheme applied, see the
      Canvas entry in `css_system_colors`. The value is the raw nscolor
      uint32 with R in the low byte and includes the alpha channel;
      `css_system_colors` also emits 8-char RRGGBBAA.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
      - tom@mozilla.com
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1889931
    expires: never
    data_sensitivity:
      - technical

  color_canvastext:
    type: quantity
    unit: RGB
    description: >
      The Canvas default foreground from
      PreferenceSheet::ContentPrefs::ColorsFor(ColorScheme::Light)
      .mDefault (see PopulateCSSProperties in nsUserCharacteristics.cpp).
      Same forced-Light semantics as `color_canvas`: dark-mode users still
      see the Light default here, while the content-rendered value lives
      in the CanvasText entry of `css_system_colors`. The value is the
      raw nscolor uint32 with R in the low byte and includes the alpha
      channel; `css_system_colors` also emits 8-char RRGGBBAA.
    lifetime: application
    send_in_pings:
      - user-characteristics
    notification_emails:
