<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MozRadio Tests</title>
    <script src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js"></script>
    <script src="chrome://mochikit/content/tests/SimpleTest/EventUtils.js"></script>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://mochikit/content/tests/SimpleTest/test.css"
    />
    <script
      type="module"
      src="chrome://global/content/elements/moz-radio-group.mjs"
    ></script>
    <script src="lit-test-helpers.js"></script>
    <script>
      let testHelpers = new InputTestHelpers();

      add_setup(async function setup() {
        let { html } = await testHelpers.setupLit();
        let templateFn = (attrs, children) => html`
          <moz-radio-group name="test-name" label="Radio group label">
            <moz-radio ${attrs}>${children}</moz-radio>
          </moz-radio-group>
        `;
        testHelpers.setupTests({ templateFn });
        testHelpers.activatedProperty =
          customElements.get("moz-radio").activatedProperty;
      });

      add_task(async function testMozRadioProperties() {
        await testHelpers.testCommonInputProperties("moz-radio", {
          type: "radio",
        });
      });

      add_task(async function testMozRadioBadge() {
        let group = document.createElement("moz-radio-group");
        let radio = document.createElement("moz-radio");
        radio.label = "Radio with badge";
        radio.badge = "exclusive";
        group.append(radio);
        document.body.append(group);
        registerCleanupFunction(() => group.remove());
        await radio.updateComplete;
        let badges = radio.shadowRoot.querySelectorAll("moz-badge");
        is(badges.length, 1, "A radio renders exactly one badge");
        is(badges[0].getAttribute("type"), "exclusive", "The badge uses the requested type");
        radio.badge = "";
        await radio.updateComplete;
        is(radio.shadowRoot.querySelectorAll("moz-badge").length, 0, "An empty badge removes it");
      });
    </script>
  </head>
  <body></body>
</html>
