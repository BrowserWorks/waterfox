# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sign
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Reuse artifacts from a specific build workflow run (for pipeline builds, pass the Deployment run id; the fallback only sees standalone Build runs)
        required: false
        type: string
      manual_resign:
        description: Force "manual re-sign" mode (use GitHub App token to download artifacts from a separate run)
        required: false
        default: 'true'
        type: string
  workflow_call:
    inputs:
      build_run_id:
        required: false
        type: string
      manual_resign:
        required: false
        default: 'false'
        type: string
    outputs:
      versiondisplay:
        description: Display version carried from the build metadata
        value: "${{ jobs.prepare.outputs.version_display }}"
      sign_run_id:
        description: Sign workflow run id
        value: "${{ jobs.prepare.outputs.sign_run_id }}"
      build_run_id:
        description: Resolved build workflow run id
        value: "${{ jobs.prepare.outputs.build_run_id }}"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_AS_ACCOUNT:
        required: true
      AZURE_AS_ENDPOINT:
        required: true
      AZURE_AS_PROFILE:
        required: true
      MACOS_CERTIFICATE:
        required: true
      MACOS_CERTIFICATE_PWD:
        required: true
      MACOS_CI_KEYCHAIN_PWD:
        required: true
      MACOS_NOTARIZATION_APPLE_ID:
        required: true
      MACOS_NOTARIZATION_PWD:
        required: true
      MACOS_NOTARIZATION_TEAM_ID:
        required: true
      MACOS_PROVISIONPROFILE:
        required: true
      ONE_PEM:
        required: true
      SIGN_BASE64:
        required: true
      ARTIFACTS_APP_ID:
        required: false
      ARTIFACTS_APP_PRIVATE_KEY:
        required: false
      AUS_BASE_URL:
        required: false
permissions:
  contents: read
  actions: read

env:
  MACH_MAIN_PID: "0"

jobs:
  prepare:
    name: Resolve build & metadata
    runs-on: namespace-profile-linux-xs
    timeout-minutes: 120
    outputs:
      build_run_id: "${{ steps.resolve.outputs.build_run_id }}"
      version_display: "${{ steps.meta.outputs.VERSION_DISPLAY }}"
      pre_release: "${{ steps.meta.outputs.PRE_RELEASE }}"
      tag_version: "${{ steps.meta.outputs.TAG_VERSION }}"
      sign_run_id: "${{ steps.sign_run.outputs.sign_run_id }}"
    steps:
      - name: Resolve build run
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BUILD_RUN_ID_INPUT: "${{ inputs.build_run_id }}"
        with:
          script: |
            const provided = process.env.BUILD_RUN_ID_INPUT;
            if (provided) {
              core.setOutput('build_run_id', provided.trim());
              return;
            }
            const branch = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              status: 'success',
              branch,
              per_page: 1,
            });
            if (!data.workflow_runs.length) {
              throw new Error(`No successful build workflow runs found on branch ${branch} to sign.`);
            }
            core.setOutput('build_run_id', `${data.workflow_runs[0].id}`);
      - name: Require GitHub App credentials for manual re-sign
        if: ${{ inputs.manual_resign == 'true' }}
        env:
          ARTIFACTS_APP_ID: ${{ secrets.ARTIFACTS_APP_ID }}
          ARTIFACTS_APP_PRIVATE_KEY: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$ARTIFACTS_APP_ID" || -z "$ARTIFACTS_APP_PRIVATE_KEY" ]]; then
            echo "Missing required secrets for manual re-sign: ARTIFACTS_APP_ID and/or ARTIFACTS_APP_PRIVATE_KEY" >&2
            exit 1
          fi
      - name: Create GitHub App token (for manual re-sign artifact downloads)
        if: ${{ inputs.manual_resign == 'true' }}
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.ARTIFACTS_APP_ID }}
          private-key: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
      - name: Download build metadata
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: build-metadata
          path: build-metadata
          run-id: ${{ steps.resolve.outputs.build_run_id }}
      - name: Load build metadata
        id: meta
        run: |
          cat build-metadata/build-metadata.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            if [[ -n "$key" ]]; then
              echo "$key=$value" >> "$GITHUB_OUTPUT"
            fi
          done < build-metadata/build-metadata.env
      - name: Capture sign run id
        id: sign_run
        run: echo "sign_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Record sign metadata
        run: echo "SIGN_RUN_ID=${GITHUB_RUN_ID}" >> build-metadata/build-metadata.env
      - name: Upload sign metadata (intermediate)
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: sign-metadata-base
          path: build-metadata/build-metadata.env
  windows-sign:
    name: Windows ${{ matrix.label }} signing
    needs:
      - prepare
    runs-on:
      - namespace-profile-linux-md
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            key: WIN
            arch: x86_64-pc-windows-msvc
            mar_arch: x86_64
            aus_platform: WINNT_x86_64
            signed_artifact: windows-signed
          - label: ARM64
            key: WINARM
            arch: aarch64-pc-windows-msvc
            mar_arch: aarch64
            aus_platform: WINNT_aarch64
            signed_artifact: windows-arm64-signed
    permissions:
      id-token: write
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      MAR_ARCH: ${{ matrix.mar_arch }}
      META_KEY: ${{ matrix.key }}
      MOZ_OBJDIR: obj-${{ matrix.arch }}
      VERSION_DISPLAY: "${{ needs.prepare.outputs.version_display }}"
      PRE_RELEASE: "${{ needs.prepare.outputs.pre_release }}"
      AS_ACCOUNT: "${{ secrets.AZURE_AS_ACCOUNT }}"
      AS_ENDPOINT: "${{ secrets.AZURE_AS_ENDPOINT }}"
      AS_PROFILE: "${{ secrets.AZURE_AS_PROFILE }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            browser/config
            browser/installer/windows
            build
            other-licenses/7zstub
            python
            scripts
            security/mac
            taskcluster/config.yml
            testing/gtest
            testing/mozbase
            testing/web-platform/tests/tools/third_party/certifi
            third_party/python
            toolkit/mozapps/installer
            tools/signing
            tools/update-packaging
            waterfox/build
      - name: Create GitHub App token (manual re-sign)
        if: ${{ inputs.manual_resign == 'true' }}
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.ARTIFACTS_APP_ID }}
          private-key: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
      - name: Download Windows build artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: windows-${{ matrix.arch }}-build
          path: obj-${{ matrix.arch }}
          run-id: "${{ needs.prepare.outputs.build_run_id }}"
      - name: Build dependencies
        run: |
          sudo apt update
          mkdir -p $HOME/.mozbuild
          curl -L https://github.com/ebourg/jsign/releases/download/7.4/jsign_7.4_all.deb --output jsign_7.4_all.deb
          echo "2327100d665eabd4f394b279d0183812b5c8c7393e769a95e82c4c83853de98a  jsign_7.4_all.deb" | sha256sum -c -
          sudo apt install -y msitools python3-cryptography ./jsign_7.4_all.deb
          curl -L --retry 5 --fail -o /tmp/7zz.tar.zst "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-7zz.latest/artifacts/public/build/7zz.tar.zst"
          mkdir -p /tmp/7zz && tar --zstd --strip-components=1 -xf /tmp/7zz.tar.zst -C /tmp/7zz
          sudo install -m 0755 /tmp/7zz/7zz /usr/local/bin/7zz
      - name: Azure CLI Login via OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: Sign and package
        id: installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN_BASE64: ${{ secrets.SIGN_BASE64 }}
          ONE_PEM: ${{ secrets.ONE_PEM }}
        run: |
          TOKEN=$(az account get-access-token --resource https://codesigning.azure.net -t "$AZURE_TENANT_ID" --query accessToken -o tsv)
          export TOKEN

          jsign --storetype TRUSTEDSIGNING --keystore "$AS_ENDPOINT" --storepass env:TOKEN --alias "$AS_ACCOUNT/$AS_PROFILE" \
            "obj-${ARCH}/browser/installer/windows/instgen/setup.exe" \
            "obj-${ARCH}/dist/waterfox/**/*.exe" \
            "obj-${ARCH}/dist/waterfox/**/*.dll"

          printf '%s' "$SIGN_BASE64" | base64 --decode > sign.zip
          unzip -q sign.zip
          rm sign.zip
          chmod +x ./sign/sign.sh

          ./sign/sign.sh -k "$PWD"/sign/1 -p "$ONE_PEM" -c "$PWD"/sign/2 -i "$PWD/obj-${ARCH}/dist/waterfox" -t windows
          rm -rf ./sign/

          ./mach python -m mozbuild.action.zip -C "obj-${ARCH}/dist" waterfox.zip waterfox

          ./mach repackage installer -o "Waterfox Setup ${VERSION_DISPLAY}.exe" --package-name waterfox --package "obj-${ARCH}/dist/waterfox.zip" --tag browser/installer/windows/app.tag --setupexe "obj-${ARCH}/browser/installer/windows/instgen/setup.exe" --sfx-stub other-licenses/7zstub/firefox/7zSD.Win32.sfx --use-upx

          jsign --storetype TRUSTEDSIGNING --keystore "$AS_ENDPOINT" --storepass env:TOKEN --alias "$AS_ACCOUNT/$AS_PROFILE" \
            "Waterfox Setup ${VERSION_DISPLAY}.exe"

          shasum -a 512 "Waterfox Setup ${VERSION_DISPLAY}.exe" > "Waterfox Setup ${VERSION_DISPLAY}.exe.sha512"

          {
            echo "INSTALLER_HASH=$(awk '{print $1}' "Waterfox Setup ${VERSION_DISPLAY}.exe.sha512")"
            echo "INSTALLER_SIZE=$(ls -l "Waterfox Setup ${VERSION_DISPLAY}.exe" | awk '{print $5}')"
          } >> "$GITHUB_ENV"
      - name: Package MAR
        id: mar
        run: |
          MAR_BIN="$PWD/obj-${ARCH}/dist/host/bin/mar"
          chmod +x "$MAR_BIN" || true

          INI_PATH="obj-${ARCH}/dist/waterfox/application.ini"
          if [[ ! -f "$INI_PATH" ]]; then
            echo "Expected application.ini at $INI_PATH but not found"
            find "obj-${ARCH}/dist" -maxdepth 4 -name application.ini -print || true
            exit 1
          fi

          MAR_CHANNEL=release
          if [[ $PRE_RELEASE == 'true' ]]; then
            MAR_CHANNEL=beta
          fi
          ./mach repackage mar -i "obj-${ARCH}/dist/waterfox.zip" --mar "$MAR_BIN" -o "waterfox-${VERSION_DISPLAY}.complete.mar" --arch "$MAR_ARCH" --mar-channel-id "$MAR_CHANNEL"

          VERSION=$(grep '\<Version\>' "$INI_PATH" | cut -d'=' -f2)
          BUILDID=$(grep 'BuildID=' "$INI_PATH" | cut -d'=' -f2)
          SHA512=$(shasum -a 512 waterfox-${VERSION_DISPLAY}.complete.mar | awk '{print $1}')
          SIZE=$(ls -l waterfox-${VERSION_DISPLAY}.complete.mar | awk '{print $5}')

          echo "Display Version: ${VERSION_DISPLAY}, Version: $VERSION, Build ID: $BUILDID, File Size: $SIZE, SHA512: $SHA512"

          mkdir -p aus-meta
          {
            if [[ "$META_KEY" == "WIN" ]]; then
              echo "APP_VERSION=$VERSION"
              echo "BUILD_ID=$BUILDID"
            fi
            echo "${META_KEY}_MAR_HASH=$SHA512"
            echo "${META_KEY}_MAR_SIZE=$SIZE"
            echo "${META_KEY}_INSTALLER_HASH=$INSTALLER_HASH"
            echo "${META_KEY}_INSTALLER_SIZE=$INSTALLER_SIZE"
          } > "aus-meta/${META_KEY}.env"
      - name: Generate partial MAR
        env:
          AUS_BASE_URL: ${{ secrets.AUS_BASE_URL }}
          OS_ARCH: ${{ matrix.aus_platform }}
        run: |
          chmod +x "obj-${ARCH}/dist/host/bin/mbsdiff" || true
          MAR_BIN="$PWD/obj-${ARCH}/dist/host/bin/mar" \
          MBSDIFF_BIN="$PWD/obj-${ARCH}/dist/host/bin/mbsdiff" \
            scripts/ci/make-partial.sh "waterfox-${VERSION_DISPLAY}.complete.mar" "aus-meta/${META_KEY}.env"
      - name: Upload Windows signed artifacts
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: ${{ matrix.signed_artifact }}
          path: |
            Waterfox Setup ${{ env.VERSION_DISPLAY }}.exe
            Waterfox Setup ${{ env.VERSION_DISPLAY }}.exe.sha512
            waterfox-${{ env.VERSION_DISPLAY }}.complete.mar
            waterfox-*.partial.mar
      - name: Upload AUS metadata
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: aus-meta-${{ matrix.key }}
          path: aus-meta/${{ matrix.key }}.env
  macos-sign:
    name: macOS signing
    needs:
      - prepare
    runs-on: namespace-profile-macos-tahoe-lg
    timeout-minutes: 120
    env:
      ARCH_X64: x86_64-apple-darwin
      ARCH_ARM64: aarch64-apple-darwin
      META_KEY: MAC
      VERSION_DISPLAY: "${{ needs.prepare.outputs.version_display }}"
      PRE_RELEASE: "${{ needs.prepare.outputs.pre_release }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            browser/config
            browser/installer/windows
            build
            other-licenses/7zstub
            python
            scripts
            security/mac
            taskcluster/config.yml
            testing/gtest
            testing/mozbase
            testing/web-platform/tests/tools/third_party/certifi
            third_party/python
            toolkit/mozapps/installer
            tools/signing
            tools/update-packaging
            waterfox/browser/branding
            waterfox/build
      - name: Create GitHub App token (manual re-sign)
        if: ${{ inputs.manual_resign == 'true' }}
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.ARTIFACTS_APP_ID }}
          private-key: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
      - name: Download X64 artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: macos-${{ env.ARCH_X64 }}-build
          path: "./obj-${{ env.ARCH_X64 }}/dist/"
          run-id: "${{ needs.prepare.outputs.build_run_id }}"
      - name: Download ARM64 artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: macos-${{ env.ARCH_ARM64 }}-build
          path: "./obj-${{ env.ARCH_ARM64 }}/dist/"
          run-id: "${{ needs.prepare.outputs.build_run_id }}"
      - name: Override version_display.txt
        env:
          TAG_VERSION: "${{ needs.prepare.outputs.tag_version }}"
        run: |
          if [[ -n "${TAG_VERSION}" ]]; then
            printf '%s\n' "${TAG_VERSION}" > browser/config/version_display.txt
          fi
      - name: Unify .app(s)
        run: |
          MOZCONFIG=waterfox/build/mozconfig-${{ env.ARCH_X64 }} ./mach python toolkit/mozapps/installer/unify.py obj-${{ env.ARCH_X64 }}/dist/waterfox/*.app obj-${{ env.ARCH_ARM64 }}/dist/waterfox/*.app
      - name: Add certificate and provisioning
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
        run: |
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > Certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import Certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          echo "Create keychain profile"
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$MACOS_NOTARIZATION_APPLE_ID" --team-id "$MACOS_NOTARIZATION_TEAM_ID" --password "$MACOS_NOTARIZATION_PWD"
      - name: Embed provisioning profile
        env:
          MACOS_PROVISIONPROFILE: ${{ secrets.MACOS_PROVISIONPROFILE }}
        run: |
          APP="$PWD/obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app"
          PROFILE_PATH="$APP/Contents/embedded.provisionprofile"
          printf '%s' "$MACOS_PROVISIONPROFILE" | base64 --decode > "$PROFILE_PATH"
          chmod 0644 "$PROFILE_PATH"
          test -s "$PROFILE_PATH"
      - name: Sign .app(s)
        env:
          SIGN_BASE64: ${{ secrets.SIGN_BASE64 }}
          ONE_PEM: ${{ secrets.ONE_PEM }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          sudo chmod -R 755 ./obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app
          xattr -dr com.apple.quarantine ./obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app
          python3 -m pip install --break-system-packages cryptography==49.0.0
          printf '%s' "$SIGN_BASE64" | base64 --decode > sign.zip
          unzip -q sign.zip
          rm sign.zip
          chmod +x ./sign/sign.sh
          ./sign/sign.sh -k "$PWD"/sign/1 -p "$ONE_PEM" -c "$PWD"/sign/2 -i "$PWD"/obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app -t macos
          rm -rf ./sign/
          ./mach macos-sign -a ./obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app -s "$MACOS_NOTARIZATION_TEAM_ID" -e production
          echo "Creating temp notarization archive"
          ditto -c -k --keepParent "./obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app" "notarization.zip"
          echo "Notarize app"
          xcrun notarytool submit "notarization.zip" --keychain-profile "notarytool-profile" --wait
          echo "Attach staple"
          xcrun stapler staple "./obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app"
      - name: Create, sign, and notarize .dmg
        id: installer
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk '/"Developer ID Application:/ {print $2; exit}')
          test -n "$SIGNING_IDENTITY"
          create-dmg \
            --volname "Waterfox" \
            --volicon "waterfox/browser/branding/disk.icns" \
            --background "waterfox/browser/branding/background.png" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon-size 128 \
            --icon "Waterfox.app" 144 175 \
            --hide-extension "Waterfox.app" \
            --app-drop-link 378 175 \
            --filesystem APFS \
            --format ULMO \
            --codesign "$SIGNING_IDENTITY" \
            --notarize "notarytool-profile" \
            --overwrite \
            "Waterfox ${VERSION_DISPLAY}.dmg" \
            "obj-${{ env.ARCH_X64 }}/dist/waterfox"
          shasum -a 512 "Waterfox ${VERSION_DISPLAY}.dmg" > "Waterfox ${VERSION_DISPLAY}.dmg.sha512"

          {
            echo "INSTALLER_HASH=$(awk '{print $1}' "Waterfox ${VERSION_DISPLAY}.dmg.sha512")"
            echo "INSTALLER_SIZE=$(ls -l "Waterfox ${VERSION_DISPLAY}.dmg" | awk '{print $5}')"
          } >> "$GITHUB_ENV"
      - name: Create MAR
        id: mar
        run: |
          MAR_BIN="$PWD/obj-${{ env.ARCH_X64 }}/dist/host/bin/mar"
          chmod +x "$MAR_BIN"

          MAR_CHANNEL=release
          if [[ $PRE_RELEASE == 'true' ]]; then
            MAR_CHANNEL=beta
          fi
          MAR="$MAR_BIN" MOZ_PRODUCT_VERSION=${VERSION_DISPLAY} MAR_CHANNEL_ID="$MAR_CHANNEL" tools/update-packaging/make_full_update.sh waterfox-${VERSION_DISPLAY}.complete.mar obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app

          INI_PATH="./obj-${{ env.ARCH_X64 }}/dist/waterfox/Waterfox.app/Contents/Resources/application.ini"
          VERSION=$(grep '\<Version\>' "$INI_PATH" | cut -d'=' -f2)
          BUILDID=$(grep 'BuildID=' "$INI_PATH" | cut -d'=' -f2)
          SHA512=$(shasum -a 512 waterfox-${VERSION_DISPLAY}.complete.mar | awk '{print $1}')
          SIZE=$(ls -l waterfox-${VERSION_DISPLAY}.complete.mar | awk '{print $5}')

          echo "Display Version: ${VERSION_DISPLAY}, Version: $VERSION, Build ID: $BUILDID, File Size: $SIZE, SHA512: $SHA512"

          mkdir -p aus-meta
          {
            echo "${META_KEY}_MAR_HASH=$SHA512"
            echo "${META_KEY}_MAR_SIZE=$SIZE"
            echo "${META_KEY}_INSTALLER_HASH=$INSTALLER_HASH"
            echo "${META_KEY}_INSTALLER_SIZE=$INSTALLER_SIZE"
          } > "aus-meta/${META_KEY}.env"
      - name: Generate partial MAR
        env:
          AUS_BASE_URL: ${{ secrets.AUS_BASE_URL }}
          OS_ARCH: Darwin_x86_64-aarch64
          MAR_ARCH: macos-x86_64-aarch64
        run: |
          if ! command -v xz > /dev/null; then
            brew install xz
          fi
          chmod +x "obj-${{ env.ARCH_X64 }}/dist/host/bin/mbsdiff" || true
          MAR_BIN="$PWD/obj-${{ env.ARCH_X64 }}/dist/host/bin/mar" \
          MBSDIFF_BIN="$PWD/obj-${{ env.ARCH_X64 }}/dist/host/bin/mbsdiff" \
            scripts/ci/make-partial.sh "waterfox-${VERSION_DISPLAY}.complete.mar" "aus-meta/${META_KEY}.env"
      - name: Upload macOS signed artifacts
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: macos-signed
          path: |
            Waterfox ${{ env.VERSION_DISPLAY }}.dmg
            Waterfox ${{ env.VERSION_DISPLAY }}.dmg.sha512
            waterfox-${{ env.VERSION_DISPLAY }}.complete.mar
            waterfox-*.partial.mar
      - name: Upload AUS metadata
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: aus-meta-${{ env.META_KEY }}
          path: aus-meta/${{ env.META_KEY }}.env
  linux-sign:
    name: Linux ${{ matrix.label }} signing
    needs:
      - prepare
    runs-on:
      - namespace-profile-linux-md
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            key: LIN
            arch: x86_64-pc-linux-gnu
            mar_arch: x86_64
            aus_platform: Linux_x86_64
            build_artifact: linux-build
            build_tar: linux-build.tar
            signed_artifact: linux-signed
          - label: ARM64
            key: LINARM
            arch: aarch64-unknown-linux-gnu
            mar_arch: aarch64
            aus_platform: Linux_aarch64
            build_artifact: linux-aarch64-build
            build_tar: linux-aarch64-build.tar
            signed_artifact: linux-arm64-signed
    env:
      ARCH: ${{ matrix.arch }}
      MAR_ARCH: ${{ matrix.mar_arch }}
      META_KEY: ${{ matrix.key }}
      BUILD_TAR: ${{ matrix.build_tar }}
      VERSION_DISPLAY: "${{ needs.prepare.outputs.version_display }}"
      PRE_RELEASE: "${{ needs.prepare.outputs.pre_release }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            browser/config
            browser/installer/windows
            build
            other-licenses/7zstub
            python
            scripts
            security/mac
            taskcluster/config.yml
            testing/gtest
            testing/mozbase
            testing/web-platform/tests/tools/third_party/certifi
            third_party/python
            toolkit/mozapps/installer
            tools/signing
            tools/update-packaging
            waterfox/build
      - name: Setup build packages
        run: |
          sudo apt update
          sudo apt install -y patchelf python3-cryptography
      - name: Create GitHub App token (manual re-sign)
        if: ${{ inputs.manual_resign == 'true' }}
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.ARTIFACTS_APP_ID }}
          private-key: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
      - name: Download Linux build artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: ${{ matrix.build_artifact }}
          path: obj-${{ matrix.arch }}/dist
          run-id: "${{ needs.prepare.outputs.build_run_id }}"
      - name: Sign and package
        id: signpkg
        env:
          DISPLAY: :0
          SIGN_BASE64: ${{ secrets.SIGN_BASE64 }}
          ONE_PEM: ${{ secrets.ONE_PEM }}
        run: |
          printf '%s' "$SIGN_BASE64" | base64 --decode > sign.zip
          unzip -q sign.zip
          rm sign.zip
          chmod +x ./sign/sign.sh

          DIST_ROOT="$PWD/obj-${ARCH}/dist"
          tar -xf "$DIST_ROOT/$BUILD_TAR" -C "$DIST_ROOT"
          rm -f "$DIST_ROOT/$BUILD_TAR"

          WATERFOX_DIR="$DIST_ROOT/waterfox"

          MAR_BIN="$DIST_ROOT/host/bin/mar"
          chmod +x "$MAR_BIN" || true

          INI_PATH="$WATERFOX_DIR/application.ini"

          ./sign/sign.sh -k "$PWD"/sign/1 -p "$ONE_PEM" -c "$PWD"/sign/2 -i "$WATERFOX_DIR" -t linux
          rm -rf ./sign/

          patchelf --add-rpath '$ORIGIN' "$WATERFOX_DIR/updater"

          for f in waterfox waterfox-bin updater glxtest vaapitest; do
            if [[ -f "$WATERFOX_DIR/$f" ]] && [[ ! -x "$WATERFOX_DIR/$f" ]]; then
              echo "ERROR: Missing executable bit: $WATERFOX_DIR/$f" >&2
              exit 1
            fi
          done

          tar -c --owner=0 --group=0 --numeric-owner --mode=go-w --exclude=.mkdir.done -jf waterfox-${VERSION_DISPLAY}.tar.bz2 -C "$DIST_ROOT" waterfox
          shasum -a 512 waterfox-${VERSION_DISPLAY}.tar.bz2 > waterfox-${VERSION_DISPLAY}.tar.bz2.sha512

          MAR_CHANNEL=release
          if [[ $PRE_RELEASE == 'true' ]]; then
            MAR_CHANNEL=beta
          fi
          ./mach repackage mar -i waterfox-${VERSION_DISPLAY}.tar.bz2 --mar "$MAR_BIN" -o waterfox-${VERSION_DISPLAY}.complete.mar --arch "$MAR_ARCH" --mar-channel-id "$MAR_CHANNEL"

          VERSION=$(grep '\<Version\>' "$INI_PATH" | cut -d'=' -f2)
          BUILDID=$(grep 'BuildID=' "$INI_PATH" | cut -d'=' -f2)
          SHA512=$(shasum -a 512 waterfox-${VERSION_DISPLAY}.complete.mar | awk '{print $1}')
          SIZE=$(ls -l waterfox-${VERSION_DISPLAY}.complete.mar | awk '{print $5}')
          INSTALLER_HASH=$(awk '{print $1}' "waterfox-${VERSION_DISPLAY}.tar.bz2.sha512")
          INSTALLER_SIZE=$(ls -l "waterfox-${VERSION_DISPLAY}.tar.bz2" | awk '{print $5}')

          echo "Display Version: ${VERSION_DISPLAY}, Version: $VERSION, Build ID: $BUILDID, File Size: $SIZE, SHA512: $SHA512"

          mkdir -p aus-meta
          {
            echo "${META_KEY}_MAR_HASH=$SHA512"
            echo "${META_KEY}_MAR_SIZE=$SIZE"
            echo "${META_KEY}_INSTALLER_HASH=$INSTALLER_HASH"
            echo "${META_KEY}_INSTALLER_SIZE=$INSTALLER_SIZE"
          } > "aus-meta/${META_KEY}.env"
      - name: Generate partial MAR
        env:
          AUS_BASE_URL: ${{ secrets.AUS_BASE_URL }}
          OS_ARCH: ${{ matrix.aus_platform }}
        run: |
          MAR_BIN="$PWD/obj-${ARCH}/dist/host/bin/mar" \
          MBSDIFF_BIN="$PWD/obj-${ARCH}/dist/host/bin/mbsdiff" \
            scripts/ci/make-partial.sh "waterfox-${VERSION_DISPLAY}.complete.mar" "aus-meta/${META_KEY}.env"
      - name: Upload Linux signed artifacts
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: ${{ matrix.signed_artifact }}
          path: |
            waterfox-${{ env.VERSION_DISPLAY }}.tar.bz2
            waterfox-${{ env.VERSION_DISPLAY }}.tar.bz2.sha512
            waterfox-${{ env.VERSION_DISPLAY }}.complete.mar
            waterfox-*.partial.mar
      - name: Upload AUS metadata
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: aus-meta-${{ matrix.key }}
          path: aus-meta/${{ matrix.key }}.env
  finalize-metadata:
    name: Finalize sign metadata
    needs:
      - prepare
      - windows-sign
      - macos-sign
      - linux-sign
    runs-on: namespace-profile-linux-xs
    timeout-minutes: 120
    steps:
      - name: Download intermediate sign metadata
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          name: sign-metadata-base
          path: .
      - name: Download AUS metadata
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          pattern: aus-meta-*
          merge-multiple: true
          path: aus-meta
      - name: Append per-platform AUS metadata
        run: cat aus-meta/*.env >> build-metadata.env
      - name: Upload sign metadata
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1
        with:
          name: sign-metadata
          path: build-metadata.env
