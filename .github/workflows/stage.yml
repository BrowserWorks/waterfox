# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stage
on:
  workflow_dispatch:
    inputs:
      DISPLAY_VERSION:
        description: Input display version
        required: true
        type: string
      PRE_RELEASE:
        description: This is a pre-release (true or false)
        required: true
        type: string
      SIGN_RUN_ID:
        description: Sign workflow run id to pull artifacts from
        required: true
        type: string
      manual_stage:
        description: Force "manual stage" mode (use GitHub App token to download artifacts from a separate run)
        required: false
        default: 'true'
        type: string
  workflow_call:
    inputs:
      DISPLAY_VERSION:
        description: Input display version
        required: true
        type: string
      PRE_RELEASE:
        description: This is a pre-release (true or false)
        required: true
        type: string
      SIGN_RUN_ID:
        description: Sign workflow run id to pull artifacts from
        required: true
        type: string
      manual_stage:
        description: Force "manual stage" mode (use GitHub App token to download artifacts from a separate run)
        required: false
        default: 'false'
        type: string
    outputs:
      versiondisplay:
        description: Output display version
        value: '${{ jobs.stage.outputs.versionout }}'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      CF_ACCESS_KEY_ID:
        required: false
      CF_ACCESS_KEY_SECRET:
        required: false
      CF_ENDPOINT:
        required: true
      ARTIFACTS_APP_ID:
        required: false
      ARTIFACTS_APP_PRIVATE_KEY:
        required: false
      AUS_BASE_URL:
        required: true
      AUS_ADMIN_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
env:
  DISPLAY_VERSION: '${{ inputs.DISPLAY_VERSION }}'
  PRE_RELEASE: '${{ inputs.PRE_RELEASE }}'
  RCLONE_S3_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID || secrets.CF_ACCESS_KEY_ID }}'
  RCLONE_S3_ACL: private
  RCLONE_S3_ENDPOINT: '${{ secrets.CF_ENDPOINT }}'
  RCLONE_S3_PROVIDER: Cloudflare
  RCLONE_S3_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.CF_ACCESS_KEY_SECRET }}'
jobs:
  stage:
    name: Multi-platform
    runs-on: namespace-profile-linux-sm
    timeout-minutes: 120
    outputs:
      versionout: '${{ steps.versionexport.outputs.version }}'
    steps:
      - name: Output VERSION_DISPLAY
        id: versionexport
        run: echo "version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
      - name: Setup rclone
        uses: ./.github/actions/setup-rclone
      - name: Require GitHub App credentials for manual stage
        if: ${{ inputs.manual_stage == 'true' }}
        env:
          ARTIFACTS_APP_ID: ${{ secrets.ARTIFACTS_APP_ID }}
          ARTIFACTS_APP_PRIVATE_KEY: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$ARTIFACTS_APP_ID" || -z "$ARTIFACTS_APP_PRIVATE_KEY" ]]; then
            echo "Missing required secrets for manual stage: ARTIFACTS_APP_ID and/or ARTIFACTS_APP_PRIVATE_KEY" >&2
            exit 1
          fi
      - name: Create GitHub App token (manual stage)
        if: ${{ inputs.manual_stage == 'true' }}
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.ARTIFACTS_APP_ID }}
          private-key: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
      - name: Download Windows artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: windows-signed
          run-id: ${{ inputs.SIGN_RUN_ID }}
          path: win/
      - name: Stage Windows
        run: |
          rclone copyto "win/Waterfox Setup ${DISPLAY_VERSION}.exe" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/WINNT_x86_64/Waterfox Setup ${DISPLAY_VERSION}.exe"
          rclone copyto "win/Waterfox Setup ${DISPLAY_VERSION}.exe.sha512" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/WINNT_x86_64/Waterfox Setup ${DISPLAY_VERSION}.exe.sha512"
          rclone copyto "win/waterfox-${DISPLAY_VERSION}.complete.mar" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/WINNT_x86_64/waterfox-${DISPLAY_VERSION}.complete.mar"
          shopt -s nullglob
          for f in win/waterfox-*.partial.mar; do
            rclone copyto "$f" \
              ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/WINNT_x86_64/$(basename "$f")"
          done
      - name: Download macOS artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: macos-signed
          run-id: ${{ inputs.SIGN_RUN_ID }}
          path: mac/
      - name: Stage macOS
        run: |
          rclone copyto "mac/Waterfox ${DISPLAY_VERSION}.dmg" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/Darwin_x86_64-aarch64/Waterfox ${DISPLAY_VERSION}.dmg"
          rclone copyto "mac/Waterfox ${DISPLAY_VERSION}.dmg.sha512" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/Darwin_x86_64-aarch64/Waterfox ${DISPLAY_VERSION}.dmg.sha512"
          rclone copyto "mac/waterfox-${DISPLAY_VERSION}.complete.mar" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/Darwin_x86_64-aarch64/waterfox-${DISPLAY_VERSION}.complete.mar"
          shopt -s nullglob
          for f in mac/waterfox-*.partial.mar; do
            rclone copyto "$f" \
              ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/Darwin_x86_64-aarch64/$(basename "$f")"
          done
      - name: Download Linux artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: linux-signed
          run-id: ${{ inputs.SIGN_RUN_ID }}
          path: lin/
      - name: Stage Linux
        run: |
          rclone copyto "lin/waterfox-${DISPLAY_VERSION}.tar.bz2" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/Linux_x86_64/waterfox-${DISPLAY_VERSION}.tar.bz2"
          rclone copyto "lin/waterfox-${DISPLAY_VERSION}.tar.bz2.sha512" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/Linux_x86_64/waterfox-${DISPLAY_VERSION}.tar.bz2.sha512"
          rclone copyto "lin/waterfox-${DISPLAY_VERSION}.complete.mar" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/Linux_x86_64/waterfox-${DISPLAY_VERSION}.complete.mar"
          shopt -s nullglob
          for f in lin/waterfox-*.partial.mar; do
            rclone copyto "$f" \
              ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/Linux_x86_64/$(basename "$f")"
          done
      - name: Download Windows ARM64 artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: windows-arm64-signed
          run-id: ${{ inputs.SIGN_RUN_ID }}
          path: winarm/
      - name: Stage Windows ARM64
        run: |
          rclone copyto "winarm/Waterfox Setup ${DISPLAY_VERSION}.exe" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/WINNT_aarch64/Waterfox Setup ${DISPLAY_VERSION}.exe"
          rclone copyto "winarm/Waterfox Setup ${DISPLAY_VERSION}.exe.sha512" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/WINNT_aarch64/Waterfox Setup ${DISPLAY_VERSION}.exe.sha512"
          rclone copyto "winarm/waterfox-${DISPLAY_VERSION}.complete.mar" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/WINNT_aarch64/waterfox-${DISPLAY_VERSION}.complete.mar"
          shopt -s nullglob
          for f in winarm/waterfox-*.partial.mar; do
            rclone copyto "$f" \
              ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/WINNT_aarch64/$(basename "$f")"
          done
      - name: Download Linux ARM64 artifact
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: linux-arm64-signed
          run-id: ${{ inputs.SIGN_RUN_ID }}
          path: linarm/
      - name: Stage Linux ARM64
        run: |
          rclone copyto "linarm/waterfox-${DISPLAY_VERSION}.tar.bz2" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/Linux_aarch64/waterfox-${DISPLAY_VERSION}.tar.bz2"
          rclone copyto "linarm/waterfox-${DISPLAY_VERSION}.tar.bz2.sha512" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/Linux_aarch64/waterfox-${DISPLAY_VERSION}.tar.bz2.sha512"
          rclone copyto "linarm/waterfox-${DISPLAY_VERSION}.complete.mar" \
            ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/Linux_aarch64/waterfox-${DISPLAY_VERSION}.complete.mar"
          shopt -s nullglob
          for f in linarm/waterfox-*.partial.mar; do
            rclone copyto "$f" \
              ":s3:cdn/waterfox/staging/${DISPLAY_VERSION}/update/Linux_aarch64/$(basename "$f")"
          done
      - name: Download sign metadata
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          name: sign-metadata
          run-id: ${{ inputs.SIGN_RUN_ID }}
          path: sign-metadata/
      - name: Publish to AUS staging (QA self-update path)
        env:
          AUS_BASE_URL: ${{ secrets.AUS_BASE_URL }}
          AUS_ADMIN_TOKEN: ${{ secrets.AUS_ADMIN_TOKEN }}
        run: scripts/ci/aus-publish.sh staging sign-metadata/build-metadata.env
