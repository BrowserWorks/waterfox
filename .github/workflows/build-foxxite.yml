name: Build Foxxite (Universal Mobile & Desktop)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🪟 Desktop Windows x64 & x86
    runs-on: windows-2022
    env:
      MOZCONFIG: .mozconfig-x86_64-pc-windows-msvc
      ARCH: x86_64-pc-windows-msvc
    steps:
      - name: 📤 Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 💿 Setup build packages
        run: |
          mkdir -p $HOME/.mozbuild
          rustup override set 1.90.0
          rustup target add x86_64-pc-windows-msvc
          rustup target add i686-pc-windows-msvc
          # Set up Mozilla Build

      - name: 🏗 Build Stage 1 (Generate PGO)
        run: |
          export WFX_RELEASE=1
          export GEN_PGO=1
          ./mach --no-interactive bootstrap --application-choice=browser
          ./mach build

      - name: 🏗 Run PGO
        run: |
          LLVM_PROFDATA=$PWD/clang/bin/llvm-profdata JARLOG_FILE=en-US.log ./mach python build/pgo/profileserver.py --binary ./obj-${{ env.ARCH }}/dist/waterfox/waterfox.exe

      - name: 🏗 Build Stage 2 (Use PGO)
        run: |
          export WFX_RELEASE=1
          export USE_PGO=1
          ./mach build

      - name: 📦 Package
        run: |
          ./mach package

      - name: ↑ Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Foxxite-Windows-Installer
          path: obj-${{ env.ARCH }}/dist/waterfox-installer.exe

  build-android-universal:
    name: 🤖 Android Universal (x86, x64, armv7, arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: 📤 Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 💿 Setup build packages
        run: |
          mkdir -p $HOME/.mozbuild
          curl -L https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-clang-20.latest/artifacts/public/build/clang.tar.zst -o clang.tar.zst
          sudo apt update && sudo apt install -y zstd nasm yasm m4 python3 python3-pip
          zstd -d clang.tar.zst
          tar -xf clang.tar -C $HOME/.mozbuild
          rustup override set 1.90.0
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: 🏗 Build Universal APK
        run: |
          # Setup mozconfig for universal architectures: arm64-v8a, armeabi-v7a, x86, x86_64
          export MOZ_ANDROID_FAT_AAR_ARCHITECTURES="aarch64,armeabi-v7a,x86,x86_64"
          ./mach --no-interactive bootstrap --application-choice=mobile_android
          ./mach build
          ./gradlew assembleRelease

      - name: ↑ Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Foxxite-Universal-APK
          path: mobile/android/fenix/app/build/outputs/apk/release/app-release.apk
